  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لوحة الأنشطة اليومية الناطقة</title>
<style>
  :root{
    --bg:#fdf1e3;
    --card-border-active:#ffb400;
    --text:#122447;
    --header:#1c3f8f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    font-family:"Segoe UI","Tahoma","Arial",sans-serif;
    color:var(--text);
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    -webkit-user-select:none;
    touch-action: manipulation;
    overscroll-behavior:contain;
    width:100%;
    overflow-x:hidden;
  }
  .wrap{
    max-width:1150px;
    margin:0 auto;
    padding:14px 12px calc(40px + env(safe-area-inset-bottom));
    padding-left:calc(12px + env(safe-area-inset-left));
    padding-right:calc(12px + env(safe-area-inset-right));
  }
  header{
    text-align:center;
    padding:10px 6px 16px;
  }
  header h1{
    font-size:clamp(18px,4.2vw,28px);
    margin:0 0 4px;
    color:var(--header);
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:clamp(13px,3vw,16px);
    color:#4a5f8a;
  }
  .offline-badge{
    display:inline-block;
    margin-top:8px;
    background:#e6f7ec;
    border:1px solid #a9e5bf;
    color:#1c6b3c;
    padding:4px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
  }
  .missing-badge{
    display:inline-block;
    margin-top:8px;
    margin-inline-start:6px;
    background:#fff3cd;
    border:1px solid #ffe08a;
    color:#7a5b00;
    padding:4px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
  }
  .controls{
    display:flex;
    gap:10px;
    justify-content:center;
    align-items:center;
    margin:12px 0 18px;
    flex-wrap:wrap;
  }
  .controls button{
    border-radius:999px;
    padding:12px 20px;
    font-size:15px;
    font-weight:700;
    background:#ffffff;
    color:var(--header);
    border:2px solid #c9d9f5;
    cursor:pointer;
    touch-action: manipulation;
    min-height:44px;
  }
  .controls button:active{
    transform:scale(0.95);
    background:#f0f5ff;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  @media(min-width:480px){
    .grid{gap:14px;}
  }
  @media(min-width:560px){
    .grid{grid-template-columns:repeat(4,1fr);}
  }
  @media(min-width:820px){
    .grid{grid-template-columns:repeat(5,1fr);}
  }
  @media(min-width:1050px){
    .grid{grid-template-columns:repeat(6,1fr);}
  }
  .card{
    background:#fff;
    border-radius:20px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    line-height:0;
    box-shadow:0 6px 0 rgba(47,111,237,0.15);
    transition: transform .08s ease, box-shadow .08s ease;
    touch-action: manipulation;
    aspect-ratio: 1 / 1;
    -webkit-tap-highlight-color: transparent;
  }
  .card img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    pointer-events:none;
  }
  .card:active{
    transform:scale(0.94);
  }
  .card.speaking{
    transform:scale(0.94);
    box-shadow:0 2px 0 rgba(255,180,0,0.5);
  }
  .card::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:20px;
    box-shadow: inset 0 0 0 5px var(--card-border-active);
    opacity:0;
    transition:opacity .15s ease;
    pointer-events:none;
  }
  .card.speaking::after{opacity:1;}
  .card.no-audio::before{
    content:"⏺ بانتظار التسجيل";
    position:absolute;
    top:6px;
    left:6px;
    background:#fff3cd;
    color:#7a5b00;
    font-size:10px;
    font-weight:700;
    padding:2px 6px;
    border-radius:8px;
    z-index:2;
  }
  footer{
    text-align:center;
    margin-top:22px;
    font-size:12px;
    color:#7488ac;
  }
</style>
</head>

const grid = document.getElementById('grid');
let lastItem = null;
let currentAudio = null;

function speakFallback(text, cardEl){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ar-SA';
  utter.rate = 0.95;
  if(cardEl){
    cardEl.classList.add('speaking');
    utter.onend = () => cardEl.classList.remove('speaking');
    utter.onerror = () => cardEl.classList.remove('speaking');
  }
  window.speechSynthesis.speak(utter);
}

function playItem(item, cardEl){
  lastItem = item;
  if(currentAudio){
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
  if(!item.audio){
    speakFallback(item.label, cardEl);
    return;
  }
  const audio = new Audio(item.audio);
  currentAudio = audio;
  if(cardEl){
    cardEl.classList.add('speaking');
    audio.onended = () => cardEl.classList.remove('speaking');
    audio.onerror = () => cardEl.classList.remove('speaking');
  }
  audio.play().catch(()=>{ if(cardEl) cardEl.classList.remove('speaking'); });
}

items.forEach(item => {
  const card = document.createElement('div');
  card.className = 'card' + (item.audio ? '' : ' no-audio');
  const img = document.createElement('img');
  img.src = item.img;
  img.alt = item.label;
  card.appendChild(img);
  card.addEventListener('click', () => playItem(item, card));
  grid.appendChild(card);
});

document.getElementById('repeatBtn').addEventListener('click', () => {
  if(lastItem) playItem(lastItem, null);
});
</script>
